<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Page not found · Tandy Messenger</title>
<meta name="description" content="Page not found on Tandy Messenger.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://tandymessenger.com/404.html">
<link rel="icon" type="image/png" href="/assets/iconB.png">
<style>
@font-face { font-family: "Rubik"; font-style: normal; font-weight: 300 900; font-display: swap; src: url(/fonts/rubik.woff2) format("woff2"); }
:root { --bg: #f5f9fc; --ink: #1c3055; --ink-2: #3d4f72; --link: #2a4fa0; --line: #c9d3e3; --focus: #1c3055; color-scheme: light; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-size: 1.125rem; font-family: "Rubik", system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
main { max-width: 70ch; margin-inline: auto; padding: 2rem max(1rem, env(safe-area-inset-right, 0px)) 4rem max(1rem, env(safe-area-inset-left, 0px)); }
a { color: var(--link); text-underline-offset: 2px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
.skip { position: absolute; left: -9999px; } .skip:focus { left: 1rem; top: .5rem; background: var(--bg); color: var(--ink); padding: .5rem 1rem; z-index: 10; }
.back { display: inline-block; margin-bottom: 1.5rem; }
#content { scroll-margin-top: 5rem; }  /* the skip link's target, clear of the sticky tools bar */
h1 { font-size: clamp(1.9rem, 5vw, 2.5rem); line-height: 1.15; margin: 0 0 .75rem; letter-spacing: -.02em; }
main h2 { font-size: 1.375rem; line-height: 1.3; margin: 2rem 0 .5rem; }
main h3 { font-size: 1.15rem; margin: 1.2rem 0 .3rem; }
.lead { font-size: 1.25rem; }
.meta { color: var(--ink-2); margin: 0 0 1.5rem; }
section + section { border-top: 2px solid var(--line); margin-top: 3rem; padding-top: 2rem; }
main footer { border-top: 2px solid var(--line); margin-top: 3rem; padding-top: 1rem; }
main footer ul { list-style: none; padding: 0; display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; }

:root { --scale: 1; --leading: 1.6; --t-bg: #ffffff; --t-ink: #1c3055; --t-panel: #f2f5fa; --t-line: #c9d3e3; }
html { font-size: calc(100% * var(--scale)); }
body { line-height: var(--leading); }
:root.contrast { --bg: #000000; --ink: #ffffff; --ink-2: #ffffff; --link: #ffff00; --accent: #ffff00; --line: #ffffff; --panel: #000000; --focus: #ffff00; color-scheme: dark;
  --t-bg: #000000; --t-ink: #ffffff; --t-panel: #000000; --t-line: #ffffff; }
:root.readable body, :root.readable .tools { font-family: Verdana, Tahoma, Arial, sans-serif; letter-spacing: .02em; word-spacing: .08em; }
:root.spacing { --leading: 2; }
:root.spacing p, :root.spacing li { margin-bottom: 1.2em; }
:root.links a { background: var(--link, var(--accent)); color: var(--bg); padding: 0 .2em; text-decoration: underline; text-decoration-thickness: 2px; }
/* the bar: its own colours, font and width, the same on every page */
.tools { position: sticky; top: 0; z-index: 5; background: var(--t-panel); color: var(--t-ink); border-bottom: 2px solid var(--t-line);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.4;
  padding: .6rem max(1rem, env(safe-area-inset-right, 0px)) .6rem max(1rem, env(safe-area-inset-left, 0px)); }
.tools-in { max-width: 44rem; margin-inline: auto; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: flex-end; }
.tools .tools-toggle { display: inline-flex; align-items: center; gap: .5rem; min-height: 44px; padding: 0 1rem 0 .75rem; border: 0; border-radius: 999px;
  background: var(--t-ink); color: var(--t-bg); font: inherit; font-size: .95rem; font-weight: 600; cursor: pointer; }
.tools .tools-toggle svg { fill: currentColor; flex: none; }
.tools .tools-toggle[aria-expanded="true"] { outline: 2px solid var(--t-ink); outline-offset: 2px; }
.tools :focus-visible { outline: 3px solid var(--t-ink); outline-offset: 3px; }
.tools-panel { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
.tools-panel[hidden] { display: none; }
/* the status line is read aloud by screen readers ("Text size 115%"), not shown */
.tools-status { position: absolute; width: 1px; height: 1px; margin: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.tools button:not(.tools-toggle) { font: inherit; font-size: .95rem; min-height: 44px; padding: .3rem .8rem; color: var(--t-ink); background: var(--t-bg); border: 2px solid var(--t-ink); border-radius: .4rem; cursor: pointer; }
.tools button[aria-pressed="true"] { background: var(--t-ink); color: var(--t-bg); }
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<section class="tools" aria-label="Display tools">
  <div class="tools-in">
    <button type="button" class="tools-toggle" id="t-toggle" aria-expanded="false" aria-controls="tools-panel"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="4.2" r="2.2"/><path d="M4 7.6l8 1.2 8-1.2.4 2-5.6 1.2v3.4l2.4 7.6-2 .6-3.2-6.8-3.2 6.8-2-.6 2.4-7.6v-3.4L3.6 9.6z"/></svg><span>Display tools</span></button>
    <div class="tools-panel" id="tools-panel" hidden>
    <button type="button" id="t-smaller">A− Smaller text</button>
    <button type="button" id="t-bigger">A+ Larger text</button>
    <button type="button" data-toggle="contrast" aria-pressed="false">High contrast</button>
    <button type="button" data-toggle="readable" aria-pressed="false">Readable font</button>
    <button type="button" data-toggle="links" aria-pressed="false">Highlight links</button>
    <button type="button" data-toggle="spacing" aria-pressed="false">Line spacing</button>
    <button type="button" id="t-reset">Reset</button>
    <p id="tools-status" class="tools-status" role="status" aria-live="polite"></p>
    </div>
  </div>
</section>
<main id="main">
<a class="back" href="/">← Back to the site</a>

<section lang="en" dir="ltr">
<h1 id="content" tabindex="-1">This page wandered off.</h1>
<p>The llama looked everywhere. Try the <a href="/">home page</a>.</p>
</section>

</main>
<script>
(() => {
  // display tools: classes on <html>, nothing stored, no outside code
  const root = document.documentElement, status = document.getElementById('tools-status');
  const toggle = document.getElementById('t-toggle'), panel = document.getElementById('tools-panel');
  const open = on => { panel.hidden = !on; toggle.setAttribute('aria-expanded', String(on)); };
  toggle.onclick = () => open(panel.hidden);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panel.hidden) { open(false); toggle.focus(); } });
  const say = t => { status.textContent = t; };
  let scale = 1;
  const setScale = v => { scale = Math.min(2, Math.max(.9, Math.round(v * 100) / 100)); root.style.setProperty('--scale', scale); say('Text size ' + Math.round(scale * 100) + '%'); };
  document.getElementById('t-bigger').onclick = () => setScale(scale + .15);
  document.getElementById('t-smaller').onclick = () => setScale(scale - .15);
  document.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => {
    const on = root.classList.toggle(b.dataset.toggle);
    b.setAttribute('aria-pressed', String(on));
    say(b.textContent + (on ? ' on' : ' off'));
  }));
  document.getElementById('t-reset').onclick = () => {
    root.className = ''; setScale(1);
    document.querySelectorAll('[data-toggle]').forEach(b => b.setAttribute('aria-pressed', 'false'));
    say('Display reset');
  };
})();
</script>
</body>
</html>
